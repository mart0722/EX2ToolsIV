// RemoteViews are inflated by the launcher at its own density. Generate scaled
// layouts from the existing XML so older hosts can resize controls and text
// together while keeping the same view IDs and PendingIntents.
def widgetResources = file('src/main/res')
def scaledWidgetResources = layout.buildDirectory.dir('generated/res/scaledWidgets')
def providers = fileTree("${widgetResources}/xml") { include 'widget_info_*.xml' }
def widgetLayouts = fileTree("${widgetResources}/layout") { include 'widget_*.xml' }
def widgetStyles = file("${widgetResources}/values/styles_widgets.xml")

def generateScaledWidgets = tasks.register('generateScaledWidgets') {
    inputs.files(providers, widgetLayouts, widgetStyles).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(scaledWidgetResources)

    doLast {
        File output = scaledWidgetResources.get().asFile
        project.delete(output)
        File layouts = new File(output, 'layout')
        File values = new File(output, 'values')
        layouts.mkdirs()
        values.mkdirs()

        Map<String, List<Integer>> baseSizes = [:]
        providers.each { provider ->
            String xml = provider.getText('UTF-8')
            String name = (xml =~ /android:initialLayout="@layout\/(\w+)"/)[0][1]
            int width = (xml =~ /android:minWidth="(\d+)dp"/)[0][1].toInteger()
            int height = (xml =~ /android:minHeight="(\d+)dp"/)[0][1].toInteger()
            baseSizes[name] = [width, height]
        }
        baseSizes.widget_clock_condensed = baseSizes.widget_clock_classic
        baseSizes.widget_clock_condensed_date = baseSizes.widget_clock_classic_date
        baseSizes.remove('widget_speed')

        String styles = widgetStyles.getText('UTF-8').replaceAll(/<\?xml[^?]*\?>/, '').trim()
                .replaceFirst('<resources>', '').replaceFirst('</resources>', '').trim()
        StringBuilder scaledStyles = new StringBuilder('<resources>\n')
        def scaleDimensions = { String xml, int eighths ->
            xml.replaceAll(/([" >])(-?\d+(?:\.\d+)?)(dp|sp)(["<])/) { String match, String open,
                                                                        String number, String unit, String close ->
                open + (number.toBigDecimal() * eighths / 8).stripTrailingZeros().toPlainString() + unit + close
            }
        }

        // 50% through 400% in steps of 12.5%, with the original XML at 100%.
        for (int step = 4; step <= 32; step++) {
            if (step == 8) continue
            String suffix = "_scale_${step}"
            String renamedStyles = styles.replaceAll(/(name|parent)="(Wg\w+)"/) {
                String match, String attr, String name -> "${attr}=\"${name}${suffix}\""
            }
            scaledStyles.append(scaleDimensions(renamedStyles, step)).append('\n')

            baseSizes.keySet().each { name ->
                String xml = new File(widgetResources, "layout/${name}.xml").getText('UTF-8')
                xml = xml.replaceAll(/@style\/(Wg\w+)/) { String match, String style ->
                    "@style/${style}${suffix}"
                }
                new File(layouts, "${name}${suffix}.xml").setText(scaleDimensions(xml, step), 'UTF-8')
            }
        }
        baseSizes.each { name, size ->
            scaledStyles.append("<integer-array name=\"${name}_base_size\">")
                    .append("<item>${size[0]}</item><item>${size[1]}</item></integer-array>\n")
        }
        new File(values, 'scaled_widgets.xml').setText(scaledStyles.append('</resources>\n').toString(), 'UTF-8')
    }
}

android.sourceSets.main.res.srcDir(scaledWidgetResources)
tasks.named('preBuild').configure { dependsOn(generateScaledWidgets) }
