plugins {
    id 'com.android.application'
}

def platformStore = rootProject.file('signing/platform.jks')
def platformStorePassword = project.findProperty('EX2_STORE_PASSWORD') ?: System.getenv('EX2_STORE_PASSWORD') ?: ''
def platformKeyAlias = project.findProperty('EX2_KEY_ALIAS') ?: System.getenv('EX2_KEY_ALIAS') ?: 'platform'
def platformKeyPassword = project.findProperty('EX2_KEY_PASSWORD') ?: System.getenv('EX2_KEY_PASSWORD') ?: ''

android {
    namespace 'com.ex2tools.iv'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.ex2tools.iv'
        minSdk 28
        targetSdk 29
    versionCode 88
    versionName '1.8.28'
        resConfigs 'ru'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        platform {
            if (platformStore.exists()) {
                storeFile platformStore
                storePassword platformStorePassword
                keyAlias platformKeyAlias
                keyPassword platformKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (platformStore.exists()) {
                signingConfig signingConfigs.platform
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (platformStore.exists()) {
                signingConfig signingConfigs.platform
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly project(':car-stubs')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.alphacephei:vosk-android:0.3.75'
}







